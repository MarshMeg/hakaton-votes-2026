name: CI

# Проверки бэкенда, сборка образа и деплой. Сборка APK — в android.yml (при изменениях в mobile/).

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests/ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Миграции проверяются на той же СУБД, что в проде (docker-compose.yml), а не на SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: votes
          POSTGRES_USER: votes
          POSTGRES_PASSWORD: votes
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U votes"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Миграции (PostgreSQL)
        env:
          DATABASE_URL: postgres://votes:votes@localhost:5432/votes
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput

  # Образ web собирается здесь, а не на сервере, и публикуется в GitHub Container Registry:
  # ghcr.io/<владелец>/<репозиторий>/web:<sha коммита> (и :latest). Условия — как у deploy.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # В имени образа допустимы только строчные буквы, а владелец репозитория — MarshMeg.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          # Кэш слоёв в GitHub Actions: пока uv.lock не менялся, зависимости не переустанавливаются.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Деплой на сервер: только из main и только после зелёных проверок и сборки образа. На сервер
  # копируются compose-файлы и deploy/, образ web скачивается из GHCR (deploy/deploy.sh).
  # Если после переключения сайт не отвечает — возвращается предыдущий образ, задача падает.
  # Файл .env на сервере не трогается. Настройки репозитория: секрет DEPLOY_SSH_KEY, переменные
  # DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS и DEPLOY_URL (адрес для проверки после деплоя).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH-ключ и отпечаток сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Скопировать проект на сервер
        run: >
          rsync -az --delete
          --exclude .git --exclude .github --exclude .env --exclude mobile --exclude docs
          ./ "$TARGET:/opt/votes/"
      - name: Переключить на новый образ
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Токен действует только во время задачи, поэтому после скачивания образа сразу выходим.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh "$TARGET" "/opt/votes/deploy/deploy.sh '$IMAGE'" || status=$?
          ssh "$TARGET" "docker logout ghcr.io"
          exit $status
      - name: Проверить, что сайт отвечает
        id: check
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "${{ vars.DEPLOY_URL }}/content.json"
      - name: Откатить на предыдущий образ
        if: failure() && steps.check.outcome == 'failure'
        run: |
          ssh "$TARGET" "/opt/votes/deploy/deploy.sh --rollback"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "${{ vars.DEPLOY_URL }}/content.json"
          echo "::error::Новый образ $IMAGE не ответил, сервер возвращён на предыдущий"
