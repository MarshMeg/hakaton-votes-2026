{# «Выбери перевод»: в чётных раундах слово по-удмуртски, в нечётных наоборот #}
<div class="text-center">
  <div class="mx-auto h-32 w-32 text-8xl" x-show="hasPic(target)" x-html="pic(target)"></div>
  <p class="mt-3 text-3xl font-extrabold" x-show="!reverse" x-text="target.udm"></p>
  <p class="mt-3 text-2xl font-extrabold" x-show="reverse" x-text="target.ru"></p>
  <button type="button" class="mt-1 rounded-full p-1 text-muted-strong transition hover:text-brand-red active:scale-90" x-show="target.audio" @click="speak(target)" title="Послушать" aria-label="Послушать">{% include "_speaker_icon.html" with size="h-8 w-8" %}</button>
  <p class="mt-1 text-sm font-bold text-muted" x-text="reverse ? 'Как это по-удмуртски?' : 'Что это значит?'"></p>
</div>
<div class="mt-6 grid gap-3">
  <template x-for="opt in options" :key="opt.id">
    <button type="button" class="tile text-left" @click="pick(opt)" :disabled="!!feedback"
            :class="{
              '!border-ok bg-ok-faint': feedback && opt.id === target.id,
              '!border-bad bg-brand-redSoft': feedback === 'bad' && opt.id === chosen,
            }" x-text="optionText(opt)"></button>
  </template>
</div>
