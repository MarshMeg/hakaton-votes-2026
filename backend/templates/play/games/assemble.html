{# «Собери слово»: нажми букву, чтобы поставить её в слово, нажми ещё раз, чтобы вернуть #}
<div class="text-center">
  <div class="mx-auto h-28 w-28 text-8xl" x-show="hasPic(target)" x-html="pic(target)"></div>
  <p class="mt-2 text-2xl font-extrabold" x-text="target.ru"></p>
  <p class="text-sm font-bold text-muted">Собери это слово по-удмуртски</p>
</div>
<div class="mt-5 flex flex-wrap justify-center gap-2">
  <template x-for="(ch, i) in slots()" :key="'s' + i">
    <button type="button" @click="giveBack(i)"
            class="flex h-12 w-11 items-center justify-center rounded-xl border-b-4 text-2xl font-extrabold"
            :class="ch ? (feedback === 'ok' ? 'border-green-800 bg-ok text-white' : feedback === 'bad' ? 'border-red-900 bg-bad text-white' : 'border-line-strong bg-surface') : 'border-line bg-surface-sunk'"
            x-text="ch"></button>
  </template>
</div>
<div class="mt-6 flex flex-wrap justify-center gap-2">
  <template x-for="tile in letters" :key="'l' + tile.idx">
    <button type="button" @click="take(tile)" :disabled="tile.used || !!feedback"
            class="h-14 w-12 rounded-xl border-2 border-b-4 border-line bg-surface text-2xl font-extrabold transition"
            :class="tile.used ? 'opacity-20' : ''" x-text="tile.ch"></button>
  </template>
</div>
