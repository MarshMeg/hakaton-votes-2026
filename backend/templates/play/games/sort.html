{# «Сортировка»: перетащи слово в корзинку (или нажми слово, а потом корзинку). #}
<p class="text-center text-xl font-extrabold" x-text="set.title"></p>
<div class="mt-4 flex min-h-[7rem] flex-wrap justify-center gap-3">
  <template x-for="item in items" :key="item.word.id">
    {# не x-show: :style перезапишет style и сотрёт display:none #}
    <button type="button"
            class="tile flex touch-none items-center gap-2"
            :class="{ hidden: item.placed, '!border-brand-red bg-brand-redSoft': selected === item, 'animate-pulse !border-bad': shake === item.word.id }"
            :style="dragStyle(item)"
            @pointerdown="dragStart($event, item)" @pointermove="dragMove($event)"
            @pointerup="dragEnd($event)" @pointercancel="drag = null">
      <span class="pointer-events-none h-8 w-8 text-3xl" x-show="hasPic(item.word)" x-html="pic(item.word)"></span>
      <span class="pointer-events-none" x-text="item.word.udm"></span>
    </button>
  </template>
</div>
<div class="mt-6 grid gap-3" :class="groups.length > 2 ? 'grid-cols-3' : 'grid-cols-2'">
  <template x-for="(g, gi) in groups" :key="gi">
    <div :data-bucket="gi" @click="tapBucket(gi)"
         class="flex min-h-[10rem] flex-col items-center rounded-3xl border-4 border-dashed bg-surface p-3 transition"
         :class="selected ? 'border-brand-red' : 'border-line'">
      <span class="text-4xl" x-text="g.icon"></span>
      <span class="font-extrabold" x-text="g.label"></span>
      <div class="mt-2 flex flex-wrap justify-center gap-1">
        <template x-for="w in g.placed" :key="w.id">
          <span class="rounded-xl bg-ok-soft px-2 py-1 text-sm font-bold text-ok" x-text="w.udm"></span>
        </template>
      </div>
    </div>
  </template>
</div>
<p class="mt-3 text-center text-sm text-muted">Корзинка <span x-text="round + 1"></span> из <span x-text="rounds"></span></p>
