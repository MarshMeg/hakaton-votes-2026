{% extends "base.html" %}
{% block title %}Отчёт — Ӟеч-а бур-а удмурт кыл?{% endblock %}
{% block content %}
{# сводка для родителя или учителя, считается из сохранения на телефоне #}
<div x-data>
  <a href="{% url 'play:profile' %}" class="font-bold text-muted print:hidden">← Профиль</a>
  <h1 class="mt-2 text-2xl font-extrabold">📋 Отчёт об успехах</h1>
  <template x-if="$store.app.profile">
    <div>
      <p class="text-lg font-bold"><span x-text="$store.app.profile.avatar"></span> <span x-text="$store.app.profile.name"></span></p>
      <p class="text-sm text-muted" x-text="'Составлен ' + new Date().toLocaleDateString('ru-RU')"></p>

      <div class="mt-4 grid grid-cols-2 gap-3 text-center">
        <div class="card p-3"><p class="text-2xl font-extrabold" x-text="$store.app.stats.activeDays"></p><p class="text-xs font-bold text-muted">дней занятий</p></div>
        <div class="card p-3"><p class="text-2xl font-extrabold" x-text="$store.app.stats.streak"></p><p class="text-xs font-bold text-muted">дней подряд сейчас</p></div>
        <div class="card p-3"><p class="text-2xl font-extrabold" x-text="$store.app.stats.answers"></p><p class="text-xs font-bold text-muted">ответов в играх</p></div>
        <div class="card p-3"><p class="text-2xl font-extrabold" x-text="$store.app.stats.accuracy + '%'"></p><p class="text-xs font-bold text-muted">верных ответов</p></div>
      </div>

      {% include "play/_daily_chart.html" %}

      <div class="card mt-3">
        <p class="font-extrabold">Темы</p>
        <template x-for="t in $store.app.stats.topics" :key="t.slug">
          <div class="mt-2">
            <div class="flex justify-between text-sm font-bold">
              <span x-text="t.icon + ' ' + t.title"></span><span x-text="t.learned + ' / ' + t.total"></span>
            </div>
            <div class="mt-1 h-2 overflow-hidden rounded-full bg-line-soft"><div class="h-full bg-ok" :style="'width:' + t.percent + '%'"></div></div>
          </div>
        </template>
      </div>

      <button type="button" class="btn-primary mt-5 w-full print:hidden" @click="window.print()">Печать</button>
    </div>
  </template>
</div>
{% endblock %}
