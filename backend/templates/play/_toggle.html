<button type="button" class="card flex w-full items-center gap-4 text-left" @click="toggle('{{ key }}')"
        role="switch" :aria-checked="$store.app.settings.{{ key }} ? 'true' : 'false'">
  <span class="text-3xl">{{ icon }}</span>
  <span class="min-w-0 flex-1">
    <span class="block font-extrabold">{{ title }}</span>
    <span class="block text-sm text-muted-strong">{{ hint }}</span>
  </span>
  <span class="relative h-8 w-14 shrink-0 rounded-full transition"
        :class="$store.app.settings.{{ key }} ? 'bg-ok' : 'bg-line'">
    <span class="absolute top-1 h-6 w-6 rounded-full bg-surface shadow transition-all"
          :class="$store.app.settings.{{ key }} ? 'left-7' : 'left-1'"></span>
  </span>
</button>
