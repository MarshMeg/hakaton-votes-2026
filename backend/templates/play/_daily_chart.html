{# ответы за последние 7 дней: зелёным верные, красным ошибки #}
<div class="card mt-3">
  <p class="font-extrabold">Ответы по дням</p>
  <div class="mt-3 flex h-28 items-end gap-1">
    <template x-for="d in $store.app.stats.daily" :key="d.key">
      <div class="flex h-full flex-1 flex-col items-center justify-end">
        <div class="flex w-full flex-col justify-end overflow-hidden rounded-t-md"
             :style="'height:' + Math.round(100 * (d.ok + d.bad) / $store.app.stats.maxDay) + '%'"
             :title="d.key + ': верно ' + d.ok + ', ошибок ' + d.bad">
          <div class="bg-bad" :style="'flex-grow:' + d.bad"></div>
          <div class="bg-ok" :style="'flex-grow:' + d.ok"></div>
        </div>
        <span class="mt-1 text-xs font-bold text-muted-soft" x-text="d.label"></span>
      </div>
    </template>
  </div>
</div>
