{# keys — имена маршрутов, при которых пункт подсвечен #}
{% if section and section in keys %}
<a href="{{ url }}" class="flex flex-col items-center gap-0.5 py-2 text-brand-red" aria-current="page">
  <span class="text-2xl leading-none">{{ icon }}</span><span>{{ label }}</span>
</a>
{% else %}
<a href="{{ url }}" class="flex flex-col items-center gap-0.5 py-2 text-muted">
  <span class="text-2xl leading-none opacity-70 grayscale">{{ icon }}</span><span>{{ label }}</span>
</a>
{% endif %}
