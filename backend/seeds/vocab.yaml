# Словарь для раздела «Обучение» и игр. Загружается командой: python manage.py seed
#
# Источник слов — «Материалы к кейсу» (docx от организаторов). Порядок в docx местами
# перепутан (рус. — удм.), здесь везде udm — по-удмуртски, ru — перевод.
# needs_check — что нужно сверить с носителем языка перед сдачей.
#
# Поля слова: udm, ru, [alt, transcription, emoji, color, number, image, audio, needs_check].
# image/audio — пути относительно seeds/media/. Если картинки нет, показывается emoji
# (для чисел — цифра, для цветов — цветной круг).
# Тип темы (kind): words | numbers | colors | phrases. Фразы не участвуют в «Собери слово».
# family — близкие темы, которые «Найди лишнее» не смешивает (овощи и еда, дикие и домашние звери).

