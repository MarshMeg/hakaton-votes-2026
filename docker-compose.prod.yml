# Надстройка над docker-compose.yml для сервера:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Образ web собирает CI и выкатывает deploy/deploy.sh под локальным тегом votes-web:current.
# Наружу смотрит только Caddy (80/443); web, MinIO и PostgreSQL доступны лишь внутри сети compose.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-hakaton.marshmeg.ru}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # сертификаты
      - caddy_config:/config
    depends_on:
      - web

  web:
    # Если образа ещё нет (сервер без CI), compose соберёт его из ./backend под этим же тегом.
    image: votes-web:current
    restart: unless-stopped
    environment:
      # Secure-cookie и HSTS: снаружи сайт доступен только по HTTPS (вход по http://IP при этом не работает).
      DJANGO_HTTPS_ONLY: ${DJANGO_HTTPS_ONLY:-1}
      # Токены входа подписаны этим ключом: локальный ключ из docker-compose.yml здесь не годится.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Задайте DJANGO_SECRET_KEY в .env на сервере}
    ports: !reset []

  minio:
    restart: unless-stopped
    ports: !reset []

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
