# Android-приложение: Flutter + Java (для Gradle). Android SDK ставится отдельно (Android Studio).
[tools]
flutter = "3.47"
java = "temurin-17"

[tasks.setup]
description = "Сгенерировать платформенные файлы Android и скачать зависимости"
run = [
  "flutter create --platforms=android --org ru.marshmeg --project-name hakaton .",
  "rm -rf test",   # пример теста от flutter create ломает flutter analyze
  "flutter pub get",
  "dart run flutter_launcher_icons",
]

[tasks.check]
description = "flutter analyze (как в CI)"
run = "flutter analyze"

[tasks.dev]
description = "Запустить в эмуляторе против локального сервера (cd backend && mise run dev)"
run = "flutter run --dart-define=SERVER_URL=http://10.0.2.2:8000"

[tasks.apk]
description = "Собрать release APK (сервер https://hakaton.marshmeg.ru; снимок — cd ../backend && mise run bundle)"
run = "flutter build apk --release --target-platform android-arm,android-arm64"
