name: votes
description: "Ӟеч-а бур-а удмурт кыл? — игра для изучения удмуртского языка (офлайн-обёртка над веб-приложением)."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 6.1.5 не собирается с AGP из Flutter 3.47 (proguard-android.txt); исправлено в 6.2.0-beta.
  flutter_inappwebview: 6.2.0-beta.3
  path_provider: ^2.1.6
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_local_notifications: ^22.3.2
  geolocator: ^14.1.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

# Иконка приложения: `dart run flutter_launcher_icons` (входит в `mise run setup` и в CI) раскладывает
# её по android/app/src/main/res поверх стандартной иконки Flutter.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#c8102e"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  # Офлайн-снимок приложения (собирается из backend: mise run bundle). Каталоги должны
  # существовать даже без снимка — в репозитории лежат .gitkeep.
  assets:
    - assets/bundle/
    - assets/bundle/blobs/
    - assets/icon/icon.png  # логотип на заставке при запуске
